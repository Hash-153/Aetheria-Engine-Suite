<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria Game Engine & Game Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-size: 20px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #ffffff;
    }
    .tab-btn:hover:not(.active) {
      background: #30363d;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: #090d13;
    }
    canvas {
      background: #05070a;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Aetheria Engine Suite</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchGame('chrono')">Chrono Dungeon (RPG)</button>
      <button class="tab-btn" onclick="switchGame('stellar')">Stellar Vanguard (RTS)</button>
      <button class="tab-btn" onclick="switchGame('cyber')">Cyber Runner (Platformer)</button>
    </div>
  </header>
  <main>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </main>

  <script type="module">
    import { ChronoDungeonGame } from './dist/games/chrono-dungeon/src/game.js';
    import { StellarVanguardGame } from './dist/games/stellar-vanguard/src/game.js';
    import { CyberRunnerGame } from './dist/games/cyber-runner/src/game.js';

    const canvas = document.getElementById('gameCanvas');
    let currentGame = null;
    let currentGameType = 'chrono';

    window.switchGame = function(type) {
      currentGameType = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (type === 'chrono') currentGame = new ChronoDungeonGame(canvas);
      else if (type === 'stellar') currentGame = new StellarVanguardGame(canvas);
      else if (type === 'cyber') currentGame = new CyberRunnerGame(canvas);
    };

    // Initialize default game
    currentGame = new ChronoDungeonGame(canvas);

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (currentGame) {
        currentGame.update(dt);
        currentGame.render();
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
